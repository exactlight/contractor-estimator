<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>Contractor Estimate Pro</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
        }
        
        .btn-settings {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 12px;
            border-radius: 12px;
        }
        
        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .project-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 16px;
            transition: transform 0.2s;
            border-left: 6px solid #3498db;
        }
        
        .project-card:hover {
            transform: translateY(-4px);
        }
        
        .phase-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }
        
        .phase-lead { background: #e8f4f8; color: #2980b9; }
        .phase-walkthrough-scheduled { background: #fff3cd; color: #856404; }
        .phase-walkthrough-complete { background: #d1ecf1; color: #0c5460; }
        .phase-estimate-presented { background: #e2e3e5; color: #383d41; }
        .phase-estimate-approved { background: #d4edda; color: #155724; }
        .phase-estimate-declined { background: #f8d7da; color: #721c24; }
        .phase-project-active { background: #cce5ff; color: #004085; }
        .phase-project-billed { background: #d1ecf1; color: #0c5460; }
        .phase-project-complete { background: #d4edda; color: #155724; }
        
        .empty-state {
            text-align: center;
            color: rgba(255,255,255,0.6);
            padding: 60px 20px;
        }
        
        .hidden {
            display: none !important;
        }
        
        .job-header {
            background: linear-gradient(135deg, #ecf0f1 0%, #bdc3c7 100%);
            padding: 20px;
            border-radius: 16px 16px 0 0;
            cursor: pointer;
        }
        
        .job-body {
            padding: 20px;
            background: white;
            border-radius: 0 0 16px 16px;
        }
        
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin: 12px 0;
        }
        
        .photo-item {
            position: relative;
            padding-bottom: 100%;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .photo-item img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .task-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .task-hours {
            width: 70px;
            text-align: center;
        }
        
        .summary-box {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            padding: 16px;
            border-radius: 12px;
            color: white;
            margin-bottom: 16px;
        }
        
        .live-estimate {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            padding: 20px;
            border-radius: 16px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(39, 174, 96, 0.3);
            z-index: 50;
        }
        
        .expense-item {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 8px;
            border-left: 4px solid #ffc107;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 8px;
        }
        
        .filter-tab {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .filter-tab.active {
            background: rgba(255,255,255,0.3);
            font-weight: 600;
        }
    </style>
</head>

        function initApp() {
            diagLog('initApp called');
            console.log('App initializing...');
            
            // Check if jsPDF loaded (but don't wait forever)
            if (typeof window.jspdf === 'undefined') {
                diagLog('jsPDF not loaded (PDF export disabled)', 'warning');
            } else {
                diagLog('jsPDF loaded', 'success');
            }
            
            // Load data and render regardless
            try {
                diagLog('Loading data...');
                loadData();
                diagLog('Data loaded', 'success');
                diagLog('Rendering...');
                render();
                diagLog('Render complete!', 'success');
            } catch(e) {
                diagLog('ERROR: ' + e.message, 'error');
            }
        }
        
        // Project phases
        const PHASES = {
            LEAD: 'Lead',
            WALKTHROUGH_SCHEDULED: 'Walkthrough Scheduled',
            WALKTHROUGH_COMPLETE: 'Walkthrough Complete',
            ESTIMATE_PRESENTED: 'Estimate Presented',
            
            
            PROJECT_ACTIVE: 'Project Active',
            PROJECT_DECLINED: 'Project Declined',
            PROJECT_BILLED: 'Project Billed',
            PROJECT_COMPLETE: 'Project Complete'
        };
        
        // Simple state management
        const state = {
            view: 'list',
            projects: [],
            customers: [], // NEW: Customer contact database
            currentProject: null,
            filterPhase: 'all',
            settings: {
                apiKey: '',
                companyName: 'Professional Contracting',
                companyEmail: 'contact@example.com',
                companyPhone: '920-650-8300',
                defaultHourlyRate: '75',
                companyLogo: '' // NEW: Base64 logo storage
            }
        };

        // Load from localStorage
        function loadData() {
            const stored = localStorage.getItem('contractorProjects');
            if (stored) state.projects = JSON.parse(stored);
            
            const storedCustomers = localStorage.getItem('contractorCustomers');
            if (storedCustomers) state.customers = JSON.parse(storedCustomers);
            
            const storedKey = localStorage.getItem('geminiApiKey');
            if (storedKey) state.settings.apiKey = storedKey;
            
            const storedSettings = localStorage.getItem('contractorSettings');
            if (storedSettings) state.settings = JSON.parse(storedSettings);
        }

        // Save to localStorage
        function saveData() {
            try {
                localStorage.setItem('contractorProjects', JSON.stringify(state.projects));
                localStorage.setItem('contractorCustomers', JSON.stringify(state.customers));
                localStorage.setItem('geminiApiKey', state.settings.apiKey);
                localStorage.setItem('contractorSettings', JSON.stringify(state.settings));
            } catch (error) {
                if (error.name === 'QuotaExceededError') {
                    console.error('Storage quota exceeded');
                    throw error; // Re-throw so caller can handle
                } else {
                    console.error('Error saving data:', error);
                    throw error;
                }
            }
        }
        
        function getStorageUsage() {
            try {
                let total = 0;
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        total += localStorage[key].length + key.length;
                    }
                }
                // Convert to MB
                const usedMB = (total / (1024 * 1024)).toFixed(2);
                const limitMB = 5; // Most browsers allow ~5-10MB
                const percentage = ((total / (limitMB * 1024 * 1024)) * 100).toFixed(0);
                return { usedMB, percentage };
            } catch (e) {
                return { usedMB: '?', percentage: '?' };
            }
        }

        // Render functions
        function render() {
            const app = document.getElementById('app');
            
            if (state.view === 'list') {
                app.innerHTML = renderProjectList();
            } else if (state.view === 'settings') {
                app.innerHTML = renderSettings();
            } else if (state.view === 'create') {
                app.innerHTML = renderProjectForm();
            } else if (state.view === 'project') {
                app.innerHTML = renderProject();
            }
            
            attachEventListeners();
        }

        function getPhaseClass(phase) {
            if (!phase) return 'phase-lead'; // Default to lead phase
            return 'phase-' + phase.toLowerCase().replace(/\s+/g, '-');
        }

        function renderProjectList() {
            // Sort by customer name, then project name
            const sortedProjects = [...state.projects].sort((a, b) => {
                const customerCompare = a.customerName.localeCompare(b.customerName);
                if (customerCompare !== 0) return customerCompare;
                return a.name.localeCompare(b.name);
            });
            
            // Filter by phase if selected
            const filteredProjects = state.filterPhase === 'all' 
                ? sortedProjects 
                : sortedProjects.filter(p => p.phase === state.filterPhase);
            
            // Group by customer
            const groupedProjects = {};
            filteredProjects.forEach(project => {
                if (!groupedProjects[project.customerName]) {
                    groupedProjects[project.customerName] = [];
                }
                groupedProjects[project.customerName].push(project);
            });
            
            return `
                <div class="container">
                    <div class="header">
                        <h1>Projects</h1>
                        <button class="btn btn-settings" onclick="showSettings()">⚙️</button>
                    </div>
                    
                    <div class="filter-tabs">
                        <button class="filter-tab ${state.filterPhase === 'all' ? 'active' : ''}" 
                            onclick="filterByPhase('all')">All</button>
                        ${Object.values(PHASES).map(phase => `
                            <button class="filter-tab ${state.filterPhase === phase ? 'active' : ''}" 
                                onclick="filterByPhase('${phase}')">${phase}</button>
                        `).join('')}
                    </div>
                    
                    <button class="btn btn-primary" style="width: 100%; margin-bottom: 24px;" onclick="createNewProject()">
                        ➕ New Project
                    </button>
                    
                    ${filteredProjects.length === 0 ? `
                        <div class="empty-state">
                            <div style="font-size: 64px; margin-bottom: 16px;">📄</div>
                            <p style="font-size: 18px;">No projects ${state.filterPhase !== 'all' ? 'in this phase' : 'yet'}. Create your first one!</p>
                        </div>
                    ` : Object.keys(groupedProjects).map(customerName => `
                        <div style="margin-bottom: 32px;">
                            <h2 style="color: rgba(255,255,255,0.9); font-size: 20px; margin-bottom: 12px; padding-left: 8px;">
                                👤 ${customerName}
                            </h2>
                            ${groupedProjects[customerName].map(project => `
                                <div class="project-card" onclick="openProject('${project.id}')">
                                    <div style="display: flex; justify-content: space-between; align-items: start;">
                                        <div style="flex: 1;">
                                            <h3 style="margin-bottom: 8px; color: #2c3e50; font-size: 18px;">${project.name}</h3>
                                            <div class="phase-badge ${getPhaseClass(project.phase)}">${project.phase}</div>
                                            <p style="color: #95a5a6; font-size: 12px; margin-top: 8px;">
                                                ${project.jobs.length} jobs • Created ${new Date(project.createdAt).toLocaleDateString()}
                                            </p>
                                        </div>
                                        <div style="text-align: right; margin-left: 16px;">
                                            <div style="font-size: 24px; font-weight: 700; color: #27ae60;">
                                                $${calculateProjectCost(project).toFixed(2)}
                                            </div>
                                            <div style="font-size: 12px; color: #7f8c8d; margin-top: 4px;">
                                                ${calculateProjectHours(project).toFixed(1)}h
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="container">
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                            <h2 style="color: #2c3e50;">⚙️ Settings</h2>
                            <button class="btn-icon" onclick="state.view='list'; render();">✖️</button>
                        </div>
                        
                        <!-- Logo Management -->
                        <div style="background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 4px solid #3498db;">
                            <h3 style="margin-bottom: 12px;">🖼️ Company Logo</h3>
                            ${state.settings.companyLogo ? `
                                <div style="margin-bottom: 12px; text-align: center;">
                                    <img src="${state.settings.companyLogo}" 
                                        style="max-width: 200px; max-height: 100px; border: 2px solid #ecf0f1; border-radius: 8px; padding: 8px; background: white;">
                                </div>
                                <div style="display: flex; gap: 8px;">
                                    <button onclick="uploadLogo()" 
                                        style="flex: 1; background: #3498db; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">
                                        Change Logo
                                    </button>
                                    <button onclick="removeLogo()" 
                                        style="flex: 1; background: #e74c3c; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">
                                        Remove Logo
                                    </button>
                                </div>
                            ` : `
                                <p style="font-size: 14px; color: #7f8c8d; margin-bottom: 12px;">
                                    Upload your company logo to appear on all estimates, invoices, and change orders.
                                </p>
                                <button onclick="uploadLogo()" 
                                    style="width: 100%; background: #3498db; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600;">
                                    📤 Upload Logo
                                </button>
                            `}
                            <p style="font-size: 12px; color: #7f8c8d; margin-top: 8px;">
                                JPG or PNG, max 2MB. Recommended: 300x100 pixels.
                            </p>
                        </div>
                        
                        <!-- Customer Manager -->
                        <div style="background: #e8f5e9; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 4px solid #27ae60;">
                            <h3 style="margin-bottom: 12px;">👥 Customer Contacts</h3>
                            <p style="font-size: 14px; color: #2c3e50; margin-bottom: 12px;">
                                Manage your customer contact database. Edit customer details to update all their projects at once.
                            </p>
                            <button onclick="showCustomerManager()" 
                                style="width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600;">
                                👥 Manage Customers (${state.customers.length})
                            </button>

        function calculateProjectHours(project) {
            return project.jobs.reduce((total, job) => 
                total + job.tasks.reduce((sum, task) => sum + (parseFloat(task.hours) || 0), 0)
            , 0);
        }

        function calculateProjectCost(project) {
            return calculateProjectHours(project) * parseFloat(project.hourlyRate || 0);
        }

        function calculateProjectExpenses(project) {
            return project.jobs.reduce((total, job) => {
                const expenses = job.expenses || [];
                return total + expenses.reduce((sum, expense) => sum + (parseFloat(expense.amount) || 0), 0);
            }, 0);
        }

        function deleteCurrentProject() {
            if (!confirm(`Delete project "${state.currentProject.name}"? This cannot be undone.`)) {
                return;
            }
            
            const projectId = state.currentProject.id;
            const projectIndex = state.projects.findIndex(p => p.id === projectId);
            
            if (projectIndex >= 0) {
                // Remove project ID from customer's projects list
                const customer = state.customers.find(c => c.projects && c.projects.includes(projectId));
                if (customer) {
                    customer.projects = customer.projects.filter(pid => pid !== projectId);
                }
                
                state.projects.splice(projectIndex, 1);
                saveData();
                diagLog(`Project deleted: ${state.currentProject.name}`, 'warning');
                state.view = 'list';
                state.currentProject = null;
                render();
            }
        }

        function saveCustomerFromProject(projectData) {
            // Check if customer already exists by name
            let customer = state.customers.find(c => 
                c.name.toLowerCase() === projectData.customerName.toLowerCase()
            );
            
            if (!customer) {
                // Create new customer
                customer = {
                    id: 'cust-' + Date.now(),
                    name: projectData.customerName,
                    address: projectData.siteAddress || '',
                    phone: projectData.customerPhone || '',
                    email: projectData.customerEmail || '',
                    billingAddress: projectData.billingAddress || '',
                    created: new Date().toLocaleDateString(),
                    projects: []
                };
                state.customers.push(customer);
                diagLog(`New customer created: ${customer.name}`, 'success');
            } else {
                // Update existing customer info
                customer.phone = projectData.customerPhone || customer.phone;
                customer.email = projectData.customerEmail || customer.email;
                customer.address = projectData.siteAddress || customer.address;
                customer.billingAddress = projectData.billingAddress || customer.billingAddress;
            }
            
            // Link project to customer
            if (!customer.projects.includes(projectData.id)) {
                customer.projects.push(projectData.id);
            }
            
            saveData();
            return customer;
        }

        function exportBackup() {
            const backup = {
                version: '17.0',
                exported: new Date().toISOString(),
                exportDate: new Date().toLocaleDateString(),
                projects: state.projects,
                customers: state.customers,
                settings: state.settings
            };
            
            const dataStr = JSON.stringify(backup, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `contractor-backup-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            
            URL.revokeObjectURL(url);
            diagLog('Backup exported successfully', 'success');
        }
        
        function importBackup() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        try {
                            const backup = JSON.parse(event.target.result);
                            
                            // Validate backup
                            if (!backup.projects || !backup.settings) {
                                alert('Invalid backup file - missing required data');
                                return;
                            }
                            
                            const confirmMsg = `Import backup from ${backup.exportDate || 'unknown date'}?\n\n` +
                                `Projects: ${backup.projects.length}\n` +
                                `Customers: ${backup.customers ? backup.customers.length : 0}\n\n` +
                                `⚠️ This will replace all current data!`;
                            
                            if (!confirm(confirmMsg)) {
                                return;
                            }
                            
                            // Restore data
                            state.projects = backup.projects;
                            state.customers = backup.customers || [];
                            state.settings = { ...state.settings, ...backup.settings };
                            
                            saveData();
                            state.view = 'list';
                            state.currentProject = null;
                            render();
                            
                            diagLog('Backup restored successfully', 'success');
                            alert(`✅ Backup restored successfully!\n\nProjects: ${state.projects.length}\nCustomers: ${state.customers.length}`);
                        } catch (error) {
                            alert('❌ Error reading backup file: ' + error.message);
                            diagLog('Backup restore failed: ' + error.message, 'error');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

            state.currentProject.customerName = document.getElementById('customerName').value;

            state.currentProject.customerEmail = document.getElementById('customerEmail').value;

            if (!state.currentProject.name || !state.currentProject.customerName) {
                alert('Please fill in customer name and project name');
                return;
            }
            
            const existingIndex = state.projects.findIndex(p => p.id === state.currentProject.id);
            const isNewProject = existingIndex < 0;
            
            if (existingIndex >= 0) {
                state.projects[existingIndex] = state.currentProject;
            } else {
                state.projects.push(state.currentProject);
                autoUpdatePhase(state.currentProject, 'customer_added');

        function addPhoto(jobId, event) {
            const file = event.target.files[0];
            if (file) {
                // Check file size (max 2MB before compression)
                if (file.size > 2 * 1024 * 1024) {
                    alert('Image is too large. Please choose an image under 2MB.');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    // Compress the image before storing
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Calculate new dimensions (max 1200px width)
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 1200;
                        
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Compress to JPEG at 0.7 quality
                        const compressedImage = canvas.toDataURL('image/jpeg', 0.7);
                        
                        const job = state.currentProject.jobs.find(j => j.id === jobId);
                        if (!job.photos) job.photos = [];
                        job.photos.push(compressedImage);
                        
                        try {
                            saveData();
                            render();
                            diagLog('Photo added', 'success');
                        } catch (error) {
                            if (error.name === 'QuotaExceededError') {
                                alert('⚠️ Storage quota exceeded!\n\nYour browser storage is full. Please:\n1. Export a backup\n2. Delete some old projects\n3. Try adding the photo again');
                                job.photos.pop(); // Remove the photo we just added
                                diagLog('Storage quota exceeded', 'error');
                            } else {
                                throw error;
                            }
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        async function generateScope(jobId) {
            const job = state.currentProject.jobs.find(j => j.id === jobId);
            
            if (!state.settings.apiKey) {
                alert('Please set your Gemini API key in Settings');
                showSettings();
                return;
            }
            
            if (!job.description && job.photos.length === 0) {
                alert('Please add a description or photos first');
                return;
            }
            
            // Show loading
            const button = event.target;
            button.disabled = true;
            button.textContent = '⏳ Generating...';
            
            try {
                const contents = [];
                
                // Add photos
                for (const photo of job.photos) {
                    const base64Data = photo.split(',')[1];
                    contents.push({
                        inlineData: {
                            mimeType: 'image/jpeg',
                            data: base64Data
                        }
                    });
                }
                
                // Add text prompt
                contents.push({
                    text: `You are an expert construction and home repair professional. Based on the job description and photos provided, break down this work into specific tasks with time estimates.

Job Name: ${job.name}
Description: ${job.description}

Please analyze this and provide a list of specific tasks needed to complete this job with estimated hours for each task.

Format your response ONLY as a JSON object (no markdown, no explanation) with this exact structure:
{
  "tasks": [
    {"name": "Task description", "hours": 2.5},
    {"name": "Another task", "hours": 1.0}
  ]
}

Be realistic with time estimates. Include prep, execution, and cleanup time.`
                });
                
                console.log('Sending request to Gemini API...');
                
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${state.settings.apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: contents }],
                            generationConfig: {
                                temperature: 0.7,
                                maxOutputTokens: 2048,
                                responseMimeType: "application/json"
                            }
                        })
                    }
                );
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('API Error:', errorData);
                    throw new Error(`API error ${response.status}: ${errorData.error?.message || 'Unknown error'}`);
                }
                
                const data = await response.json();
                console.log('API Response:', data);
                
                if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
                    throw new Error('Invalid API response structure');
                }
                
                const text = data.candidates[0].content.parts[0].text;
                console.log('Generated text:', text);
                
                // Extract JSON
                let jsonText = text.trim();
                
                if (jsonText.includes('```json')) {
                    jsonText = jsonText.split('```json')[1].split('```')[0].trim();
                } else if (jsonText.includes('```')) {
                    jsonText = jsonText.split('```')[1].split('```')[0].trim();
                }
                
                let result;
                try {
                    result = JSON.parse(jsonText);
                } catch (parseError) {
                    console.error('JSON Parse Error:', parseError);
                    console.error('Attempted to parse:', jsonText);
                    throw new Error('Failed to parse AI response. The API returned invalid JSON.');
                }
                
                if (!result.tasks || !Array.isArray(result.tasks)) {
                    throw new Error('AI response missing tasks array');
                }
                
                job.tasks = result.tasks.map((task, idx) => ({
                    id: `${jobId}-task-${idx}-${Date.now()}`,
                    name: task.name,
                    hours: task.hours.toString()
                }));
                
                try {
                    saveData();
                    render();
                    
                    autoUpdatePhase(state.currentProject, 'tasks_generated');
                    render();
                    alert(`Success! Generated ${job.tasks.length} tasks`);
                } catch (saveError) {
                    if (saveError.name === 'QuotaExceededError') {
                        alert('⚠️ Storage quota exceeded!\n\nTasks were generated but could not be saved.\n\nPlease:\n1. Export a backup\n2. Delete some old projects\n3. Try again');
                        diagLog('Storage quota exceeded while saving tasks', 'error');
                    } else {
                        throw saveError;
                    }
                }
                
            } catch (error) {
                console.error('Full Error:', error);
                
                let errorMessage = 'Error generating scope.\n\n';
                
                if (error.message.includes('API error 400')) {
                    errorMessage += 'Invalid API key or request. Please check:\n';
                    errorMessage += '1. Your API key is correct\n';
                    errorMessage += '2. The Gemini API is enabled\n';
                    errorMessage += '3. You have available quota';
                } else if (error.message.includes('API error 429')) {
                    errorMessage += 'Rate limit exceeded. Please wait a moment and try again.';
                } else if (error.message.includes('API error 403')) {
                    errorMessage += 'API key invalid or API not enabled.\n';
                    errorMessage += 'Get a new key at: https://makersuite.google.com/app/apikey';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage += 'Network error. Please check your internet connection.';
                } else if (error.message.includes('JSON')) {
                    errorMessage += 'AI returned invalid format. Try again or simplify your description.';
                } else {
                    errorMessage += error.message;
                }
                
                alert(errorMessage);
                
                const buttons = document.querySelectorAll('button');
                buttons.forEach(btn => {
                    if (btn.textContent.includes('Generating')) {
                        btn.disabled = false;
                        btn.textContent = '✨ Generate Tasks with AI';
                    }
                });
            }
        }

        // AUTO-PHASE PROGRESSION (Complete workflow)
        function autoUpdatePhase(project, trigger) {
            diagLog('Auto-phase triggered: ' + trigger, 'info');
            
            switch(trigger) {
                case 'customer_added':
                    if (!project.phase || project.phase === '') {
                        project.phase = PHASES.LEAD;
                        diagLog('Phase set to: Lead', 'success');
                    }
                    break;
                    
                case 'walkthrough_scheduled':
                    project.phase = PHASES.WALKTHROUGH_SCHEDULED;
                    diagLog('Phase set to: Walkthrough Scheduled', 'success');
                    break;
                    
                case 'tasks_generated':
                    project.phase = PHASES.WALKTHROUGH_COMPLETE;
                    diagLog('Phase set to: Walkthrough Complete', 'success');
                    break;
                    
                case 'estimate_exported':
                    project.phase = PHASES.ESTIMATE_PRESENTED;
                    diagLog('Phase set to: Estimate Presented', 'success');
                    break;
                    
                case 'approved':
                    project.phase = PHASES.PROJECT_ACTIVE;
                    project.isApproved = true;
                    project.isDeclined = false;
                    diagLog('Phase set to: Project Active', 'success');
                    break;
                    
                case 'declined':
                    project.phase = PHASES.PROJECT_DECLINED;
                    project.isDeclined = true;
                    project.isApproved = false;
                    diagLog('Phase set to: Project Declined', 'warning');
                    break;
                    
                case 'billed':
                    project.phase = PHASES.PROJECT_BILLED;
                    diagLog('Phase set to: Project Billed', 'success');
                    break;
                    
                case 'completed':
                    project.phase = PHASES.PROJECT_COMPLETE;
                    diagLog('Phase set to: Project Complete', 'success');
                    break;
            }
            
            saveData();
        }

        async function generateCOTasksAI() {
            const jobName = document.getElementById('coJobName').value;
            const jobDesc = document.getElementById('coJobDesc').value;
            
            if (!jobName) {
                alert('Please enter a job name first');
                return;
            }
            
            if (!state.settings.apiKey) {
                alert('Please add your Gemini API key in Settings');
                return;
            }
            
            const button = event.target;
            button.disabled = true;
            button.textContent = '⏳ Generating...';
            
            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=' + state.settings.apiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Generate a detailed task list for this contracting job:
Job: ${jobName}
Description: ${jobDesc || 'No additional description'}

Return ONLY a JSON array of tasks with "name" and "hours" (estimated hours as decimal). Example:
[{"name":"Purchase materials","hours":1.5},{"name":"Prep area","hours":2.0}]

Be specific and realistic with hours. Include prep, execution, and cleanup tasks.`
                            }]
                        }]
                    })
                });
                
                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                const jsonMatch = text.match(/\[[\s\S]*\]/);
                
                if (jsonMatch) {
                    const tasks = JSON.parse(jsonMatch[0]);
                    coTasks = tasks;
                    renderCOTasks();
                    diagLog(`Generated ${tasks.length} tasks with AI`, 'success');
                } else {
                    throw new Error('Could not parse AI response');
                }
            } catch (error) {
                alert('AI generation failed: ' + error.message);
                diagLog('AI error: ' + error.message, 'error');
            } finally {
                button.disabled = false;
                button.textContent = '🤖 Generate with AI';
            }
        }

        function approveChangeOrder(index) {
            if (!confirm('Approve this change order? The changes will be applied to the project.')) {
                return;
            }
            
            const project = state.currentProject;
            const co = project.changeOrders[index];
            
            co.status = 'approved';
            co.approvedDate = new Date().toLocaleDateString();
            
            // Apply changes
            if (co.type === 'add_job') {
                project.jobs.push(co.newJob);
                diagLog(`Job "${co.newJob.name}" added to project`, 'success');
            } else if (co.type === 'modify_job') {
                const job = project.jobs.find(j => j.id === co.jobId);
                if (job) {
                    // Remove tasks
                    co.removedTasks.forEach(removeTask => {
                        const idx = job.tasks.findIndex(t => t.name === removeTask.name && t.hours === removeTask.hours);
                        if (idx >= 0) job.tasks.splice(idx, 1);
                    });
                    // Add tasks
                    co.addedTasks.forEach(addTask => {
                        job.tasks.push({ ...addTask, completed: false });
                    });
                    diagLog(`Job "${job.name}" modified`, 'success');
                }
            }
            
            saveData();
            render();
        }
        
        function declineChangeOrder(index) {
            if (!confirm('Decline this change order?')) {
                return;
            }
            
            const co = state.currentProject.changeOrders[index];
            co.status = 'declined';
            co.declinedDate = new Date().toLocaleDateString();
            
            saveData();
            render();
            diagLog(`Change order ${co.number} declined`, 'warning');
        }
        
        function deleteChangeOrder(index) {
            if (!confirm('Delete this change order?')) {
                return;
            }
            
            const project = state.currentProject;
            const co = project.changeOrders[index];
            
            // If it was approved, ask if they want to revert changes
            if (co.status === 'approved') {
                if (confirm('This change order was approved. Do you want to revert the changes to the project?')) {
                    if (co.type === 'add_job') {
                        const jobIdx = project.jobs.findIndex(j => j.id === co.newJob.id);
                        if (jobIdx >= 0) {
                            project.jobs.splice(jobIdx, 1);
                            diagLog('Job removed from project', 'info');
                        }
                    } else if (co.type === 'modify_job') {
                        const job = project.jobs.find(j => j.id === co.jobId);
                        if (job) {
                            // Re-add removed tasks
                            co.removedTasks.forEach(task => {
                                job.tasks.push({ ...task });
                            });
                            // Remove added tasks
                            co.addedTasks.forEach(addTask => {
                                const idx = job.tasks.findIndex(t => t.name === addTask.name);
                                if (idx >= 0) job.tasks.splice(idx, 1);
                            });
                            diagLog('Job changes reverted', 'info');
                        }
                    }
                }
            }
            
            // Delete the change order
            project.changeOrders.splice(index, 1);
            
            // Also remove from generated PDFs if it exists
            if (project.generatedPDFs) {
                const pdfIdx = project.generatedPDFs.findIndex(pdf => pdf.number === co.number);
                if (pdfIdx >= 0) {
                    project.generatedPDFs.splice(pdfIdx, 1);
                }
            }
            
            saveData();
            render();
            diagLog(`Change order ${co.number} deleted`, 'success');
        }
        
        function recordPayment() {
            const amount = parseFloat(document.getElementById('paymentAmount').value);
            const method = document.getElementById('paymentMethod').value;
            
            if (!amount || amount <= 0) {
                alert('Please enter a valid payment amount');
                return;
            }
            
            if (!state.currentProject.payments) state.currentProject.payments = [];
            
            state.currentProject.payments.push({
                amount: amount,
                method: method,
                date: new Date().toLocaleDateString(),
                timestamp: Date.now()
            });
            
            // Recalculate totalPaid
            state.currentProject.totalPaid = state.currentProject.payments.reduce((sum, pmt) => sum + pmt.amount, 0);
            
            // Update payment status
            const totalInvoiced = state.currentProject.totalInvoiced || 0;
            const totalPaid = state.currentProject.totalPaid;
            
            if (totalPaid >= totalInvoiced) {
                state.currentProject.paymentStatus = 'paid';
            } else if (totalPaid > 0) {
                state.currentProject.paymentStatus = 'partial';
            } else {
                state.currentProject.paymentStatus = 'unpaid';
            }
            
            saveData();
            render();
            diagLog(`Payment recorded: $${amount.toFixed(2)} via ${method}`, 'success');
        }

function updateInvoicePreview() {
    const type = document.getElementById('invoiceType').value;
    const preview = document.getElementById('invoicePreview');
    const progressInput = document.getElementById('progressInput');
    const project = state.currentProject;
    
    progressInput.style.display = type === 'progress' ? 'block' : 'none';
    
    let html = '<div style="font-size: 14px;">';
    
    if (type === 'deposit') {
        html += '<strong>Scheduling Deposit</strong><br>';
        html += 'Amount: <strong>$100.00</strong>';
    } else if (type === 'materials') {
        const expenses = getAllUninvoicedExpenses(project);
        let total = 0;
        html += '<strong>Materials & Expenses:</strong><br>';
        expenses.forEach(exp => {
            const amount = parseFloat(exp.amount);
            const fee = exp.applyShoppingFee ? Math.min(amount * 0.1, 30) : 0;
            const lineTotal = amount + fee;
            total += lineTotal;
            html += `• ${exp.name}: $${amount.toFixed(2)}`;
            if (fee > 0) html += ` + $${fee.toFixed(2)} fee`;
            html += ` = $${lineTotal.toFixed(2)}<br>`;
        });
        html += `<br><strong>Total: $${total.toFixed(2)}</strong>`;
    } else if (type === 'progress') {
        const percent = parseFloat(document.getElementById('percentComplete').value) || 0;
        const totalLabor = calculateProjectCost(project);
        const laborDue = (totalLabor * percent / 100) - (project.laborInvoiced || 0);
        const expenses = getAllUninvoicedExpenses(project);
        const expenseTotal = expenses.reduce((sum, exp) => {
            const amt = parseFloat(exp.amount);
            const fee = exp.applyShoppingFee ? Math.min(amt * 0.1, 30) : 0;
            return sum + amt + fee;
        }, 0);
        const total = laborDue + expenseTotal;
        
        html += `<strong>Progress Payment (${percent}% complete)</strong><br>`;
        html += `Labor: $${laborDue.toFixed(2)}<br>`;
        if (expenseTotal > 0) html += `Materials: $${expenseTotal.toFixed(2)}<br>`;
        html += `<br><strong>Total: $${total.toFixed(2)}</strong>`;
    } else if (type === 'final') {
        const totalLabor = calculateProjectCost(project);
        const expenses = getAllUninvoicedExpenses(project);
        const expenseTotal = expenses.reduce((sum, exp) => {
            const amt = parseFloat(exp.amount);
            const fee = exp.applyShoppingFee ? Math.min(amt * 0.1, 30) : 0;
            return sum + amt + fee;
        }, 0);
        
        const depositTotal = project.invoices
            .filter(inv => inv.type === 'deposit')
            .reduce((sum, inv) => sum + inv.amount, 0);
        
        const laborInvoiced = project.laborInvoiced || 0;
        const remainingLabor = totalLabor - laborInvoiced;
        const total = remainingLabor + expenseTotal - depositTotal;
        
        html += '<strong>Final Payment</strong><br>';
        html += `Total Labor: $${totalLabor.toFixed(2)}<br>`;
        html += `Labor Invoiced: -$${laborInvoiced.toFixed(2)}<br>`;
        html += `<strong>Remaining Labor: $${remainingLabor.toFixed(2)}</strong><br><br>`;
        if (expenseTotal > 0) html += `Uninvoiced Materials: +$${expenseTotal.toFixed(2)}<br>`;
        if (depositTotal > 0) html += `Deposit Applied: -$${depositTotal.toFixed(2)}<br>`;
        html += `<br><strong style="color: #27ae60;">Balance Due: $${total.toFixed(2)}</strong>`;
    } else if (type === 'change_order') {
        const approvedCOs = (project.changeOrders || []).filter(co => co.status === 'approved');
        if (approvedCOs.length === 0) {
            html += '<strong style="color: #e74c3c;">No approved change orders to invoice</strong>';
        } else {
            html += '<strong>Approved Change Orders:</strong><br>';
            let total = 0;
            approvedCOs.forEach(co => {
                html += `• ${co.number} - ${co.description}: $${co.costImpact.toFixed(2)}<br>`;
                total += co.costImpact;
            });
            html += `<br><strong>Total: $${total.toFixed(2)}</strong>`;
        }
    }
    
    html += '</div>';
    preview.innerHTML = html;
}

function getAllUninvoicedExpenses(project) {
    const expenses = [];
    project.jobs.forEach(job => {
        if (job.expenses) {
            job.expenses.forEach(exp => {
                if (!exp.invoiced) {
                    expenses.push({ ...exp, jobId: job.id });
                }
            });
        }
    });
    return expenses;
}

        const laborDue = (totalLabor * percentValue / 100) - (project.laborInvoiced || 0);
        
        doc.setFontSize(11);
        doc.setFont(undefined, 'bold');
        doc.text(`Progress Payment (${percentValue}% complete)`, 15, y);
        y += 10;
        doc.setFont(undefined, 'normal');
        doc.setFontSize(10);
        
        doc.text('Labor', 15, y);
        doc.text(`$${laborDue.toFixed(2)}`, 170, y);
        y += 7;
        invoiceTotal += laborDue;
        
        const expenses = getAllUninvoicedExpenses(project);
        if (expenses.length > 0) {
            y += 5;
            doc.setFont(undefined, 'bold');
            doc.text('Materials:', 15, y);
            y += 7;
            doc.setFont(undefined, 'normal');
            
            expenses.forEach(exp => {
                const amt = parseFloat(exp.amount);
                const fee = exp.applyShoppingFee ? Math.min(amt * 0.1, 30) : 0;
                const lineTotal = amt + fee;
                
                doc.text(exp.name, 15, y);
                doc.text(`$${lineTotal.toFixed(2)}`, 170, y);
                y += 5;
                invoiceTotal += lineTotal;
                
                // Mark as invoiced
                const job = project.jobs.find(j => j.id === exp.jobId);
                const expense = job.expenses.find(e => e.name === exp.name && e.amount === exp.amount);
                expense.invoiced = true;
                expense.invoiceNumber = invoiceNumber;
            });
        }
    } else if (type === 'final') {
        const totalLabor = calculateProjectCost(project);
        const expenses = getAllUninvoicedExpenses(project);
        const expenseTotal = expenses.reduce((sum, exp) => {
            const amt = parseFloat(exp.amount);
            const fee = exp.applyShoppingFee ? Math.min(amt * 0.1, 30) : 0;
            return sum + amt + fee;
        }, 0);
        
        // Calculate deposit total (to subtract from final)
        const depositTotal = project.invoices
            .filter(inv => inv.type === 'deposit')
            .reduce((sum, inv) => sum + inv.amount, 0);
        
        const laborInvoiced = project.laborInvoiced || 0;
        const remainingLabor = totalLabor - laborInvoiced;
        
        // Final invoice = Remaining Labor + Uninvoiced Materials - Deposit
        invoiceTotal = remainingLabor + expenseTotal - depositTotal;
        
        doc.setFontSize(11);
        doc.setFont(undefined, 'bold');
        doc.text('Final Payment', 15, y);
        y += 10;
        doc.setFont(undefined, 'normal');
        doc.setFontSize(10);
        
        doc.text('Total Project (Labor)', 15, y);
        doc.text(`$${totalLabor.toFixed(2)}`, 170, y);
        y += 6;
        
        doc.text('Labor Previously Invoiced', 15, y);
        doc.text(`-$${laborInvoiced.toFixed(2)}`, 170, y);
        y += 6;
        
        doc.setFont(undefined, 'bold');
        doc.text('Remaining Labor', 15, y);
        doc.text(`$${remainingLabor.toFixed(2)}`, 170, y);
        y += 10;
        doc.setFont(undefined, 'normal');
        
        if (expenses.length > 0) {
            doc.setFont(undefined, 'bold');
            doc.text('Uninvoiced Materials:', 15, y);
            y += 7;
            doc.setFont(undefined, 'normal');
            
            expenses.forEach(exp => {
                const amt = parseFloat(exp.amount);
                const fee = exp.applyShoppingFee ? Math.min(amt * 0.1, 30) : 0;
                
                doc.text(exp.name, 15, y);
                doc.text(`$${(amt + fee).toFixed(2)}`, 170, y);
                y += 5;
                
                // Mark as invoiced
                const job = project.jobs.find(j => j.id === exp.jobId);
                const expense = job.expenses.find(e => e.name === exp.name && e.amount === exp.amount);
                expense.invoiced = true;
                expense.invoiceNumber = invoiceNumber;
            });
            
            y += 3;
            doc.setFont(undefined, 'bold');
            doc.text('Total Materials', 15, y);
            doc.text(`$${expenseTotal.toFixed(2)}`, 170, y);
            y += 10;
            doc.setFont(undefined, 'normal');
        }
        
        // Show deposit deduction
        if (depositTotal > 0) {
            doc.setFont(undefined, 'bold');
            doc.text('Less: Deposit Applied', 15, y);
            doc.text(`-$${depositTotal.toFixed(2)}`, 170, y);
            y += 7;
            doc.setFont(undefined, 'normal');
        }
    }
    
    // Total line
    y += 10;
    doc.line(15, y, 195, y);
    y += 10;
    
    doc.setFontSize(16);
    doc.setFont(undefined, 'bold');
    doc.setTextColor(41, 128, 185);
    doc.text('Amount This Invoice:', 15, y);
    doc.text(`$${invoiceTotal.toFixed(2)}`, 170, y);
    
    // Invoice & Payment History
    if (project.invoices.length > 0) {
        y += 15;
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.setFont(undefined, 'bold');
        
        // Financial Summary Box
        doc.setFillColor(240, 248, 255); // Light blue background
        doc.rect(10, y - 5, 190, 55, 'F');
        doc.setDrawColor(52, 152, 219);
        doc.rect(10, y - 5, 190, 55);
        
        doc.setTextColor(41, 128, 185);
        doc.text('PROJECT FINANCIAL SUMMARY', 15, y);
        y += 8;
        
        doc.setFontSize(10);
        doc.setTextColor(0, 0, 0);
        doc.setFont(undefined, 'normal');
        
        // Calculate project totals
        const originalEstimate = calculateProjectCost(project);
        const changeOrderTotal = (project.changeOrders || [])
            .filter(co => co.status === 'approved')
            .reduce((sum, co) => sum + co.costImpact, 0);
        const projectTotal = originalEstimate + changeOrderTotal;
        const totalPaid = project.totalPaid || 0;
        const remainingBalance = project.totalInvoiced + invoiceTotal - totalPaid;
        
        doc.text(`Original Estimate:`, 15, y);
        doc.text(`$${originalEstimate.toFixed(2)}`, 180, y, { align: 'right' });
        y += 5;
        
        if (changeOrderTotal > 0) {
            doc.text(`Approved Change Orders:`, 15, y);
            doc.text(`+$${changeOrderTotal.toFixed(2)}`, 180, y, { align: 'right' });
            y += 5;
        }
        
        doc.setFont(undefined, 'bold');
        doc.text(`TOTAL PROJECT VALUE:`, 15, y);
        doc.text(`$${projectTotal.toFixed(2)}`, 180, y, { align: 'right' });
        y += 7;
        
        doc.setFont(undefined, 'normal');
        doc.text(`Amount Invoiced to Date:`, 15, y);
        doc.text(`$${(project.totalInvoiced + invoiceTotal).toFixed(2)}`, 180, y, { align: 'right' });
        y += 5;
        
        doc.text(`Payments Received:`, 15, y);
        doc.text(`-$${totalPaid.toFixed(2)}`, 180, y, { align: 'right' });
        y += 7;
        
        doc.setFont(undefined, 'bold');
        doc.setFontSize(11);
        doc.setTextColor(220, 53, 69);
        doc.text(`BALANCE DUE:`, 15, y);
        doc.text(`$${remainingBalance.toFixed(2)}`, 180, y, { align: 'right' });
        y += 12;
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(10);
        doc.setFont(undefined, 'normal');
        
        // Breakdown section
        doc.setFont(undefined, 'bold');
        doc.text('AMOUNT BREAKDOWN:', 15, y);
        y += 6;
        doc.setFont(undefined, 'normal');
        
        doc.text(`This Invoice:`, 15, y);
        doc.text(`$${invoiceTotal.toFixed(2)}`, 180, y, { align: 'right' });
        y += 5;
        
        const previousUnpaid = project.totalInvoiced - totalPaid;
        if (previousUnpaid > 0) {
            doc.text(`Previous Balance:`, 15, y);
            doc.text(`$${previousUnpaid.toFixed(2)}`, 180, y, { align: 'right' });
            y += 5;
        }
        
        doc.line(15, y, 195, y);
        y += 6;
        doc.setFont(undefined, 'bold');
        doc.setFontSize(12);
        doc.setTextColor(220, 53, 69);
        doc.text(`TOTAL DUE NOW:`, 15, y);
        doc.text(`$${remainingBalance.toFixed(2)}`, 180, y, { align: 'right' });
        y += 15;
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(10);
        
        // Payment tracking (condensed)
        if (project.payments && project.payments.length > 0) {
            doc.setFont(undefined, 'bold');
            doc.text('Payments Received:', 15, y);
            y += 6;
            doc.setFont(undefined, 'normal');
            doc.setFontSize(9);
            
            // Show only last 5 payments to keep it concise
            const recentPayments = project.payments.slice(-5);
            recentPayments.forEach(pmt => {
                doc.text(`${pmt.date} - ${pmt.method}`, 15, y);
                doc.text(`$${pmt.amount.toFixed(2)}`, 180, y, { align: 'right' });
                y += 4;
            });
            
            if (project.payments.length > 5) {
                y += 2;
                doc.setFont(undefined, 'italic');
                doc.text(`(${project.payments.length - 5} earlier payments not shown)`, 15, y);
                y += 4;
            }
            
            y += 4;
            doc.setFontSize(10);
            doc.setFont(undefined, 'bold');
            doc.text(`Total Paid:`, 15, y);
            doc.text(`$${totalPaid.toFixed(2)}`, 180, y, { align: 'right' });
            y += 8;
        }
    }
    
    // Payment methods
    y += 20;
    doc.setFontSize(11);
    doc.setTextColor(0, 0, 0);
    doc.setFont(undefined, 'bold');
    doc.text('Accepted Payment Methods:', 15, y);
    y += 7;
    doc.setFontSize(9);
    doc.setFont(undefined, 'normal');
    doc.text('Cash, Check, Venmo (@Kenneth-Collins-19)', 15, y);
    y += 4;
    doc.text('Cash App ($KenCollins3), Zelle (920-650-8300)', 15, y);
    y += 4;
    doc.text('PayPal (@ExactHouse)', 15, y);
    y += 6;
    doc.setFontSize(8);
    doc.setTextColor(100, 100, 100);
    doc.text('Please send a small test payment first to confirm before sending full amount.', 15, y);
    
    // Track labor amount for this invoice
    let laborAmount = 0;
    if (type === 'progress') {
        const percentValue = parseFloat(percent) || 0;
        const totalLabor = calculateProjectCost(project);
        laborAmount = (totalLabor * percentValue / 100) - (project.laborInvoiced || 0);
    } else if (type === 'final') {
        const totalLabor = calculateProjectCost(project);
        laborAmount = totalLabor - (project.laborInvoiced || 0);
    }
    
    // Save invoice record
    project.invoices.push({
        number: invoiceNumber,
        type: type,
        amount: invoiceTotal,
        laborAmount: laborAmount,
        date: new Date().toLocaleDateString(),
        timestamp: Date.now()
    });
    project.totalInvoiced += invoiceTotal;
    if (laborAmount > 0) {
        if (!project.laborInvoiced) project.laborInvoiced = 0;
        project.laborInvoiced += laborAmount;
    }
    
    saveData();
    
    // Store PDF as base64 for in-app viewing
    const pdfBlob = doc.output('blob');
    const reader = new FileReader();
    reader.onload = function() {
        const base64PDF = reader.result;
        
        if (!project.generatedPDFs) project.generatedPDFs = [];
        project.generatedPDFs.push({
            number: invoiceNumber,
            type: type === 'deposit' ? 'Deposit' : type === 'materials' ? 'Materials' : type === 'progress' ? 'Progress' : 'Final',
            filename: `${invoiceNumber}-${project.name.replace(/\s+/g, '-')}.pdf`,
            date: new Date().toLocaleDateString(),
            timestamp: Date.now(),
            data: base64PDF
        });
        
        saveData();
        render();
        diagLog(`PDF stored: ${invoiceNumber}`, 'success');
    };
    reader.readAsDataURL(pdfBlob);
    
    // Save PDF to downloads
    doc.save(`${invoiceNumber}-${project.name.replace(/\s+/g, '-')}.pdf`);
    
    diagLog(`Invoice ${invoiceNumber} generated: $${invoiceTotal.toFixed(2)}`, 'success');
}
    </script>
    </script>
<div id="diag-panel" style="position:fixed;top:20px;right:20px;width:400px;background:white;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.3);z-index:99999;display:flex;flex-direction:column;max-height:80vh"><div style="background:#2c3e50;color:white;padding:12px;font-weight:600;">Diagnostic</div><div id="diag-logs" style="flex:1;overflow-y:auto;padding:12px;font-size:11px;font-family:monospace;"></div><div style="padding:8px;background:#ecf0f1;text-align:center;"><button onclick="document.getElementById('diag-panel').style.display='none'" style="background:#3498db;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">Hide</button></div></div></body>
